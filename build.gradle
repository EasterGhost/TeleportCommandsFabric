plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-" + project.minecraft_version
}

loom {
    mods {
        "teleportcommandsfabric" {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url = "https://chocolateminecraft.com/maven/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    compileOnly "xaero.minimap:xaerominimap-fabric-${project.xaero_minecraft_version}:${project.xaero_minimap_version}"
    compileOnly "xaero.map:xaeroworldmap-fabric-${project.xaero_minecraft_version}:${project.xaero_worldmap_version}"
    compileOnly "xaero.lib:xaerolib-fabric-${project.xaero_minecraft_version}:${project.xaero_lib_version}"
}

sourceSets {
    teleportTest {
        java {
            srcDirs = ["src/main/java", "src/test/java"]
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/types/TeleportStatus.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/types/TeleportTarget.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/types/TeleportTargetResult.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/types/TeleportOptions.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/types/TeleportRequest.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/types/TeleportPending.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/TeleportServiceSettings.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/manager/TeleportCooldownManager.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/task/TeleportBatchDispatcher.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/record/AsyncRecordedLocationSource.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/record/RecordedLocationTeleportTargets.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/storage/schema/RecordedLocation.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/storage/schema/RecordedLocationView.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/storage/schema/RecordedLocationSnapshot.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/TeleportServiceScenarioTests.java"
            include "org/AndrewElizabeth/teleportcommandsfabric/core/teleport/test/**"
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

tasks.register("teleportCoreTest", JavaExec) {
    group = "verification"
    description = "Runs standalone core.teleport tests without compiling unfinished modules."
    dependsOn tasks.named("compileTeleportTestJava")
    classpath = sourceSets.teleportTest.runtimeClasspath
    mainClass = "org.AndrewElizabeth.teleportcommandsfabric.core.teleport.test.TeleportCoreTestSuite"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
