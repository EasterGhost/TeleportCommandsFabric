plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def includeXaeroIntegration = providers.gradleProperty("includeXaeroIntegration")
        .map { it.toBoolean() }
        .orElse(true)
def includeIntegrationCommonRequested = providers.gradleProperty("includeIntegrationCommon")
        .map { it.toBoolean() }
        .orElse(false)
def includeIntegrationCommon = includeIntegrationCommonRequested.zip(includeXaeroIntegration) { common, xaero -> common || xaero }
def integrationCommonJarName = "teleportcommandsfabric-integration-common-${project.version}.jar"
def xaeroIntegrationJarName = "teleportcommandsfabric-xaero-${project.version}.jar"
def includedJarsJson = {
    def jars = []
    if (includeIntegrationCommon.get()) {
        jars.add(integrationCommonJarName)
    }
    if (includeXaeroIntegration.get()) {
        jars.add(xaeroIntegrationJarName)
    }
    if (jars.isEmpty()) {
        return "[]"
    }
    return "[" + jars.collect { "{\"file\":\"META-INF/jars/${it}\"}" }.join(",") + "]"
}
ext.includeIntegrationCommon = includeIntegrationCommon
ext.includeXaeroIntegration = includeXaeroIntegration

base {
    archivesName = project.archives_base_name + "-" + project.minecraft_version
}

tasks.withType(AbstractArchiveTask).configureEach {
    if (!includeXaeroIntegration.get()) {
        archiveVersion = "${project.version}-core"
    }
}

sourceSets {
    integrationCommon {
        java.srcDir "src/integrations/common/java"
        resources.srcDir "src/integrations/common/resources"
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    xaeroIntegration {
        java.srcDir "src/integrations/xaero/java"
        resources.srcDir "src/integrations/xaero/resources"
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + sourceSets.integrationCommon.output
        runtimeClasspath += output + compileClasspath
    }
}

loom {
    mods {
        "teleportcommandsfabric" {
            sourceSet sourceSets.main
        }
        "teleportcommandsfabric_integration_common" {
            sourceSet sourceSets.integrationCommon
        }
        "teleportcommandsfabric_xaero" {
            sourceSet sourceSets.xaeroIntegration
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url = "https://chocolateminecraft.com/maven/"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    xaeroIntegrationCompileOnly "xaero.minimap:xaerominimap-fabric-${project.xaero_minecraft_version}:${project.xaero_minimap_version}"
    xaeroIntegrationCompileOnly "xaero.map:xaeroworldmap-fabric-${project.xaero_minecraft_version}:${project.xaero_worldmap_version}"
    xaeroIntegrationCompileOnly "xaero.lib:xaerolib-fabric-${project.xaero_minecraft_version}:${project.xaero_lib_version}"
}

apply from: "test.gradle"

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "included_jars", includedJarsJson()
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
        filter { line ->
            line.contains('"jars": []')
                    ? line.replace('"jars": []', "\"jars\": ${includedJarsJson()}")
                    : line
        }
    }
}

tasks.named("processIntegrationCommonResources") {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.named("processXaeroIntegrationResources") {
    inputs.property "version", project.version
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    if (includeIntegrationCommon.get()) {
        dependsOn "integrationCommonJar"
        from({ tasks.named("integrationCommonJar").get().archiveFile.get().asFile }) {
            into "META-INF/jars"
        }
    }
    if (includeXaeroIntegration.get()) {
        dependsOn "xaeroIntegrationJar"
        from({ tasks.named("xaeroIntegrationJar").get().archiveFile.get().asFile }) {
            into "META-INF/jars"
        }
    }
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}

tasks.register("integrationCommonJar", Jar) {
    dependsOn tasks.named("classes"), tasks.named("integrationCommonClasses")
    archiveFileName = integrationCommonJarName
    destinationDirectory = layout.buildDirectory.dir("libs/integrations")
    from sourceSets.integrationCommon.output
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}_integration_common" }
    }
}

tasks.register("xaeroIntegrationJar", Jar) {
    dependsOn tasks.named("classes"), tasks.named("integrationCommonClasses"), tasks.named("xaeroIntegrationClasses")
    archiveFileName = xaeroIntegrationJarName
    destinationDirectory = layout.buildDirectory.dir("libs/integrations")
    from sourceSets.xaeroIntegration.output
    from("LICENSE.txt") {
        rename { "LICENSE_${project.archives_base_name}_xaero" }
    }
}



// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
