plugins {
    id 'fabric-loom' version '1.15.4'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
def modVersion = project.version.toString()
def minecraftVersion = project.minecraft_version
def loaderVersion = project.loader_version
def archiveBaseName = project.archives_base_name
ext.modVersion = modVersion
ext.archiveBaseName = archiveBaseName

base {
    archivesName = archiveBaseName
}

apply from: "gradle/integrations.gradle"

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        url = "https://chocolateminecraft.com/maven/"
    }
    maven {
        name = "JourneyMap Maven"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "JourneyMap Snapshots"
        url = "https://jm.gserv.me/repository/maven-snapshots/"
    }
    maven {
        name = "BlueMap"
        url = "https://repo.bluecolored.de/releases"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly "xaero.minimap:xaerominimap-fabric-${project.xaero_minecraft_version}:${project.xaero_minimap_version}"
    modCompileOnly "xaero.map:xaeroworldmap-fabric-${project.xaero_minecraft_version}:${project.xaero_worldmap_version}"
    modCompileOnly "xaero.lib:xaerolib-fabric-${project.xaero_minecraft_version}:${project.xaero_lib_version}"
    modCompileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"
    blueMapIntegrationCompileOnly "de.bluecolored:bluemap-api:${project.bluemap_api_version}"
}

apply from: "test.gradle"

processResources {
    def includedJars = includedJarsJson()
    def buildVariant = buildVariantName()
    def metaVersion = metaVersion()
    inputs.property "version", metaVersion
    inputs.property "minecraft_version", minecraftVersion
    inputs.property "loader_version", loaderVersion
    inputs.property "included_jars", includedJars
    inputs.property "build_variant", buildVariant
    filteringCharset = "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": metaVersion,
                "minecraft_version": minecraftVersion,
                "loader_version": loaderVersion,
                "build_variant": buildVariant
        filter { line ->
            line.contains('"jars": []')
                    ? line.replace('"jars": []', "\"jars\": ${includedJars}")
                    : line
        }
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

tasks.named("sourcesJar", Jar) {
    if (includeIntegrationCommon.get()) {
        from sourceSets.integrationCommon.java
    }
    if (includeXaeroIntegration.get()) {
        from sourceSets.xaeroIntegration.java
    }
    if (includeJourneyMapIntegration.get()) {
        from sourceSets.journeyMapIntegration.java
    }
    if (includeBlueMapIntegration.get()) {
        from sourceSets.blueMapIntegration.java
    }
    from("LICENSE.txt") {
        rename { "LICENSE_${archiveBaseName}" }
    }
}

jar {
    from("LICENSE.txt") {
        rename { "LICENSE_${archiveBaseName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = archiveBaseName
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
